<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Reset Password - SmartCart</title></head>
<body>
<h2>Reset Password</h2>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}<p>{{ message }}</p>{% endfor %}
{% endwith %}
<form method="POST" action="/admin-reset-password">
  <label>Email OTP:</label><br>
  <input type="text" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code"><br><br>
  <label>New Password (at least 8 characters):</label><br>
  <input type="password" name="new_password" minlength="8" required autocomplete="new-password"><br><br>
  <label>Confirm New Password:</label><br>
  <input type="password" name="confirm_password" minlength="8" required autocomplete="new-password"><br><br>
  <button type="submit">Reset Password</button>
</form>
<p><a href="/admin-forgot-password">Request a new OTP</a></p>
</body>
</html>
