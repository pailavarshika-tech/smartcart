<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Forgot Password - SmartCart</title></head>
<body>
<h2>Forgot Password</h2>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}<p>{{ message }}</p>{% endfor %}
{% endwith %}
<p>Enter the email address you used for your admin account. We will send you an OTP.</p>
<form method="POST" action="/admin-forgot-password">
  <label>Email:</label><br>
  <input type="email" name="email" required autocomplete="email"><br><br>
  <button type="submit">Send OTP</button>
</form>
<p><a href="/admin-login">Back to Login</a></p>
</body>
</html>
