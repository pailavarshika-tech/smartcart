{% extends "base.html" %}
{% block title %}Forgot Password - SmartCart{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card" style="border-top: 4px solid var(--primary);">
    <div class="auth-header">
      <div class="auth-icon">🔑</div>
      <h2>Reset Password</h2>
      <p>Enter your registered administrator email to receive an OTP code</p>
    </div>

    <form method="POST" action="/admin-forgot-password">
      <div>
        <label for="email">Administrator Email</label>
        <input id="email" type="email" name="email" placeholder="admin@example.com" required autocomplete="email">
      </div>

      <button type="submit" style="width: 100%;" class="btn btn-primary btn-lg">
        ✉️ Send Reset OTP
      </button>
    </form>

    <div class="auth-footer">
      <p style="margin:0;">
        Remember your password? <a href="/admin-login">Back to Admin Login</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
