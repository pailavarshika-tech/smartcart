{% extends "base.html" %}
{% block title %}Delivery Address - SmartCart{% endblock %}

{% block content %}
<div class="card" style="max-width:760px; margin:20px auto; padding:32px;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px;">
    <div>
      <h2 style="margin:0 0 4px;">Delivery Address</h2>
      <p style="margin:0;">Where should we ship your selected items?</p>
    </div>
    <div class="badge badge-purple" style="font-size:13px; padding:6px 14px;">
      {{ selected_items|length }} Item(s) · ₹{{ "%.2f"|format(selected_total) }}
    </div>
  </div>

  <form method="POST" action="/user/save-address">
    <div>
      <label for="full_name">Full Recipient Name</label>
      <input id="full_name" name="full_name" required value="{{ form_data.get('full_name','') if form_data else user_name }}" placeholder="Enter recipient full name">
    </div>

    <div class="form-grid">
      <div>
        <label for="phone">Phone Number</label>
        <input id="phone" name="phone" type="tel" required pattern="[0-9]{10}" maxlength="10" value="{{ form_data.get('phone','') if form_data else '' }}" placeholder="10-digit mobile number">
      </div>
      <div>
        <label for="pincode">PIN Code</label>
        <input id="pincode" name="pincode" inputmode="numeric" required pattern="[0-9]{6}" maxlength="6" value="{{ form_data.get('pincode','') if form_data else '' }}" placeholder="6-digit PIN code">
      </div>
    </div>

    <div>
      <label for="address">House No. / Street / Area Address</label>
      <textarea id="address" name="address" rows="3" required placeholder="Enter complete door no, building and street address">{{ form_data.get('address','') if form_data else '' }}</textarea>
    </div>

    <div class="form-grid">
      <div>
        <label for="city">City</label>
        <input id="city" name="city" required value="{{ form_data.get('city','') if form_data else '' }}" placeholder="City">
      </div>
      <div>
        <label for="state">State</label>
        <input id="state" name="state" required value="{{ form_data.get('state','') if form_data else '' }}" placeholder="State">
      </div>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:14px; flex-wrap:wrap; gap:12px;">
      <a class="btn btn-light" href="/user/cart">← Back to Cart</a>
      <button type="submit" class="btn btn-primary btn-lg btn-mobile-full">Save & Review Order →</button>
    </div>
  </form>
</div>
{% endblock %}
