{% extends "base.html" %}
{% block title %}Reset Password - SmartCart{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">🛡️</div>
      <h2>Set New Password</h2>
      <p>Enter the 6-digit OTP code sent to your email and choose your new password</p>
    </div>

    <form method="POST" action="/user-reset-password">
      <div>
        <label for="otp">Email OTP</label>
        <input id="otp" type="text" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code" placeholder="6-digit OTP" style="letter-spacing:4px; text-align:center; font-weight:700;">
      </div>

      <div>
        <label for="new_password">New Password (at least 8 characters)</label>
        <input id="new_password" type="password" name="new_password" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters">
      </div>

      <div>
        <label for="confirm_password">Confirm New Password</label>
        <input id="confirm_password" type="password" name="confirm_password" minlength="8" required autocomplete="new-password" placeholder="Repeat new password">
      </div>

      <button type="submit" style="width: 100%;" class="btn btn-primary btn-lg">
        🔒 Reset Password & Sign In
      </button>
    </form>

    <div class="auth-footer">
      <p style="margin-bottom:8px;">
        OTP expired? <a href="/user-forgot-password">Request a new OTP</a>
      </p>
      <p style="margin:0; font-size:12px;">
        Remembered your password? <a href="/user-login">Back to User Sign In</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
