{% extends "base.html" %}
{% block title %}Forgot Password - SmartCart{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">🔑</div>
      <h2>Reset Password</h2>
      <p>Enter your registered customer email to receive an OTP code</p>
    </div>

    <form method="POST" action="/user-forgot-password">
      <div>
        <label for="email">Customer Email Address</label>
        <input id="email" type="email" name="email" placeholder="name@example.com" required autocomplete="email">
      </div>

      <button type="submit" style="width: 100%;" class="btn btn-primary btn-lg">
        ✉️ Send Reset OTP
      </button>
    </form>

    <div class="auth-footer">
      <p style="margin-bottom:8px;">
        Remember your password? <a href="/user-login">Back to User Sign In</a>
      </p>
      <p style="margin:0; font-size:12px;">
        Don't have an account? <a href="/user-register">Create an account</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
