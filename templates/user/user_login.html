{% extends "base.html" %}
{% block title %}User Sign In - SmartCart{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">👋</div>
      <h2>Welcome Back</h2>
      <p>Sign in to access your user profile, cart, and orders</p>
    </div>

    <form method="POST" action="/user-login">
      <div>
        <label for="email">Email Address</label>
        <input id="email" type="email" name="email" placeholder="name@example.com" required>
      </div>

      <div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <label for="password" style="margin:0;">Password</label>
          <a href="/user-forgot-password" style="font-size:12px;">Forgot Password?</a>
        </div>
        <input id="password" type="password" name="password" placeholder="Enter your account password" required style="margin-top:6px;">
      </div>

      <button type="submit" style="width: 100%;" class="btn btn-primary btn-lg">
        Sign In to Profile
      </button>
    </form>

    <div class="auth-footer">
      <p style="margin-bottom:8px;">
        Don't have a profile yet? <a href="/user-register">Create an account</a>
      </p>
      <p style="margin:0; font-size:12px;">
        Store management? <a href="/admin-login" style="color:var(--muted)">Admin Portal 🔒</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
